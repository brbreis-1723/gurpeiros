site_name: Gurpeiros
site_url: https://gurpeiros.com.br/

theme:
  name: material
  language: pt-BR
  logo: assets/imagens/PoweredByGURPS.png
  favicon: assets/imagens/dice.png
  custom_dir: overrides
  palette:
    scheme: slate # dark mode
    primary: black
    accent: amber

use_directory_urls: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

nav:
  - Início: index.md

  - Regras da Casa:
      - Resumo: regras/index.md
      - Assinaturas: 
         - Visão Geral: regras/assinatura/index.md
         - Como construir: regras/assinatura/assinatura_construcao.md
         - Tipos de assinatura: regras/assinatura/assinatura_tipo.md            
         - Destino e complicações: regras/assinatura/assinatura_destino.md                     
         - Categorias de complicações: regras/assinatura/assinatura_complicacao.md                              
      - Magia do Limiar:
         - Regras gerais: regras/magia/magia_limiar.md
         - Efeitos adicionais: regras/magia/efeitos_adicionais.md
         - Limiar e mana: regras/magia/limiar_mana.md
         - Limiar e magia cerimonial: regras/magia/magia_cerimonial.md
         - Limiar e magias de energia: regras/magia/magias_energia.md
         - Limiar e os Itens de Poder: regras/magia/limiar_itens_de_poder.md
      - Tabelas:
         - Calamidades (Magia do Limiar): regras/tabelas/calamidades.md
         - Golpes Épicos: regras/tabelas/golpes_epicos.md
         - Efeitos Épicos em magias: regras/tabelas/magia_epica.md
  - Cenários:
      - Sobre Cenários: cenarios/index.md
      - Zandia:
